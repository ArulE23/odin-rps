<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  <div class="page start">
    <h1>RPS: Human vs Computer</h1>
    <button id="play-btn">PLAY</button>
  </div>
  <div class="page playing">
    <div id="current-result">
      <span>Human: <span id="h-result">0</span> | <span>
      <span>Computer: <span id="c-result">0</span></span>
    </div>
    <div id="player-buttons">
      <button>Rock</button>
      <button>Paper</button>
      <button>Scissors</button>
    </div>
  </div>
  <div class="page end">
    <span id="end-result"></span>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>
  <script src="./main.js"></script>
</body>
</html>
