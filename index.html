<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="./style.css"/>
  <title>ODIN RPS</title>
</head>
<body>
  <div class="page start">
    <h1>RPS: Human vs Computer</h1>
    <button id="play-btn">PLAY</button>
  </div>
  <div class="page playing">
    <span id="round-result">Begin!</span>
    <div id="current-result">
      <span>Human: <span id="human-result">0</span> | <span>
      <span>Computer: <span id="computer-result">0</span></span>
    </div>
    <div id="player-buttons">
      <button>Rock</button>
      <button>Paper</button>
      <button>Scissors</button>
    </div>
  </div>
  <div class="page end">
    <span id="winner">hi</span>
    <span id="end-result">hi</span>
    <button id="play-again-btn">PLAY AGAIN</button>
  </div>
  <script src="./main.js"></script>
</body>
</html>
